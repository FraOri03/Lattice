name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      # 17.4 (#87) — every VITE_-prefixed variable is compiled into the
      # bundle at build time, so this is the gate that keeps a server-side
      # secret from being published by a build nobody thought to review.
      - name: Check no secrets reached the client bundle
        run: npm run check:secrets
