<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="padding:2px 8px 14px">
  <sc-for list="{{ rows }}" as="r" hint-placeholder-count="5">

    <div style="display:{{ r.dSec }};align-items:center;gap:6px;margin:11px 0 6px">
      <span style="font-size:10px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)">{{ r.t }}</span>
      <span style="flex:1;height:1px;background:var(--bord)"></span>
      <span style="font-size:10px;color:var(--muted);opacity:.8">{{ r.meta }}</span>
    </div>

    <div style="display:{{ r.dFields }};grid-template-columns:{{ r.cols }};gap:4px;margin-bottom:4px">
      <sc-for list="{{ r.items }}" as="f" hint-placeholder-count="4">
        <div title="{{ f.title }}" style="display:flex;align-items:center;gap:5px;height:{{ r.h }};padding:0 7px;border:1px solid var(--bord);border-radius:5px;background:var(--panel2);font-size:11px;font-variant-numeric:tabular-nums;min-width:0">
          <span style="color:var(--muted);font-size:10px;flex:none">{{ f.l }}</span>
          <span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ f.v }}</span>
        </div>
      </sc-for>
    </div>

    <div style="display:{{ r.dKv }};flex-direction:column;gap:3px;margin-bottom:4px">
      <sc-for list="{{ r.items }}" as="f" hint-placeholder-count="3">
        <div style="display:flex;align-items:center;gap:8px;font-size:11px;min-height:18px">
          <span style="color:var(--muted);flex:none">{{ f.l }}</span>
          <span style="flex:1;height:1px;background:var(--bord);opacity:.5"></span>
          <span style="color:{{ f.c }};text-align:right;font-variant-numeric:tabular-nums">{{ f.v }}</span>
        </div>
      </sc-for>
    </div>

    <div style="display:{{ r.dSlider }};align-items:center;gap:7px;margin-bottom:5px">
      <span style="width:44px;font-size:10.5px;color:var(--muted);flex:none">{{ r.l }}</span>
      <input type="range" min="{{ r.min }}" max="{{ r.max }}" step="{{ r.step }}" value="{{ r.v }}" onInput="{{ r.on }}" aria-label="{{ r.l }}" style="flex:1;min-width:0;accent-color:var(--accent)"/>
      <span style="width:36px;text-align:right;font-size:11px;font-variant-numeric:tabular-nums;flex:none">{{ r.vLabel }}</span>
    </div>

    <div style="display:{{ r.dSeg }};padding:2px;background:var(--panel2);border:1px solid var(--bord);border-radius:6px;margin-bottom:5px;gap:1px">
      <sc-for list="{{ r.items }}" as="s" hint-placeholder-count="3">
        <button onClick="{{ s.on }}" title="{{ s.title }}" aria-pressed="{{ s.a }}" style="flex:1;min-width:0;height:21px;border-radius:4px;font-size:10.5px;white-space:nowrap;overflow:hidden;background:{{ s.bg }};color:{{ s.fg }};box-shadow:{{ s.shadow }}">{{ s.l }}</button>
      </sc-for>
    </div>

    <div style="display:{{ r.dIcons }};gap:2px;flex-wrap:wrap;margin-bottom:5px">
      <sc-for list="{{ r.items }}" as="ic" hint-placeholder-count="6">
        <button onClick="{{ ic.on }}" title="{{ ic.title }}" aria-label="{{ ic.title }}" aria-pressed="{{ ic.a }}" style="width:26px;height:23px;border-radius:5px;display:flex;align-items:center;justify-content:center;background:{{ ic.bg }};color:{{ ic.fg }}" style-hover="background:var(--bord);color:var(--ink)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="{{ ic.d }}"/></svg>
        </button>
      </sc-for>
    </div>

    <div style="display:{{ r.dSw }};grid-template-columns:repeat({{ r.per }},1fr);gap:5px;margin-bottom:5px">
      <sc-for list="{{ r.items }}" as="w" hint-placeholder-count="10">
        <button onClick="{{ w.on }}" title="{{ w.title }}" aria-label="{{ w.title }}" style="position:relative;height:24px;border-radius:4px;border:1px solid {{ w.bord }};background:{{ w.c }}" style-hover="outline:2px solid var(--accent);outline-offset:1px">
          <span style="display:{{ w.dSpot }};position:absolute;right:1px;bottom:1px;width:0;height:0;border-left:6px solid transparent;border-bottom:6px solid #fff"></span>
          <span style="display:{{ w.dGlobal }};position:absolute;left:2px;top:2px;width:5px;height:5px;border-radius:3px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.35)"></span>
        </button>
      </sc-for>
    </div>

    <div style="display:{{ r.dColor }};flex-direction:column;gap:0;margin-bottom:6px">
      <div style="height:64px;border:1px solid var(--bord);border-radius:6px 6px 0 0;background:{{ r.c }}"></div>
      <div style="display:flex;align-items:center;gap:6px;padding:5px 7px;border:1px solid var(--bord);border-top:none;border-radius:0 0 6px 6px;background:var(--panel2)">
        <span style="font-size:11px;font-variant-numeric:tabular-nums">{{ r.l }}</span>
        <span style="flex:1"></span>
        <span style="font-size:10px;color:{{ r.noteColor }}">{{ r.note }}</span>
      </div>
    </div>

    <div style="display:{{ r.dGrad }};flex-direction:column;gap:6px;margin-bottom:6px">
      <div style="position:relative;height:26px;border:1px solid var(--bord);border-radius:5px;background:{{ r.css }}">
        <sc-for list="{{ r.items }}" as="st" hint-placeholder-count="2">
          <button onClick="{{ st.on }}" title="{{ st.title }}" style="position:absolute;top:-4px;left:{{ st.pos }};width:11px;height:34px;border-radius:3px;border:1.5px solid {{ st.bord }};background:{{ st.c }};box-shadow:0 1px 3px rgba(0,0,0,.4)"></button>
        </sc-for>
      </div>
    </div>

    <div style="display:{{ r.dTree }};flex-direction:column">
      <sc-for list="{{ r.items }}" as="n" hint-placeholder-count="8">
        <div onClick="{{ n.on }}" title="{{ n.title }}" style="display:flex;align-items:center;gap:5px;height:24px;padding-right:6px;padding-left:{{ n.pad }};border-left:2px solid {{ n.mark }};background:{{ n.bg }};cursor:default" style-hover="background:var(--panel2)">
          <svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="3" style="flex:none"><path d="{{ n.caret }}"/></svg>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="{{ n.iconColor }}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="{{ n.d }}"/></svg>
          <span style="flex:1;min-width:0;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:{{ n.fg }}">{{ n.name }}</span>
          <span style="display:{{ n.dRemote }};flex:none;width:15px;height:15px;border-radius:8px;background:{{ n.remoteColor }};color:#12121a;font-size:8px;font-weight:700;align-items:center;justify-content:center" title="{{ n.remoteTitle }}">{{ n.remote }}</span>
          <span style="font-size:9px;color:var(--muted);flex:none">{{ n.badge }}</span>
          <button onClick="{{ n.onLock }}" title="Lock" aria-label="Lock {{ n.name }}" style="width:15px;height:15px;display:flex;align-items:center;justify-content:center;flex:none;color:{{ n.lockColor }}">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="{{ n.shackle }}"/></svg>
          </button>
          <button onClick="{{ n.onVis }}" title="Hide" aria-label="Hide {{ n.name }}" style="width:15px;height:15px;display:flex;align-items:center;justify-content:center;flex:none;color:{{ n.visColor }}">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{ n.visD }}"/></svg>
          </button>
        </div>
      </sc-for>
    </div>

    <div style="display:{{ r.dStack }};flex-direction:column;border:1px solid var(--bord);border-radius:6px;overflow:hidden;margin-bottom:6px">
      <sc-for list="{{ r.items }}" as="it" hint-placeholder-count="3">
        <div onMouseDown="{{ it.onDrag }}" title="{{ it.title }}" style="display:flex;align-items:center;gap:6px;padding:5px 6px;background:{{ it.bg }};border-bottom:1px solid var(--bord);cursor:grab;padding-left:{{ it.pad }}">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" style="flex:none"><path d="M8 6h10M8 12h10M8 18h10M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg>
          <span style="display:{{ it.dSw }};width:14px;height:14px;border-radius:3px;border:1px solid rgba(255,255,255,.2);flex:none;background:{{ it.sw }}"></span>
          <span style="flex:1;min-width:0;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ it.name }}</span>
          <span style="font-size:10px;color:var(--muted);flex:none">{{ it.meta }}</span>
          <button onClick="{{ it.onVis }}" title="Toggle visibility" aria-label="Toggle {{ it.name }}" style="width:15px;height:15px;display:flex;align-items:center;justify-content:center;flex:none;color:{{ it.visColor }}">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{ it.visD }}"/></svg>
          </button>
          <button onClick="{{ it.onDel }}" title="Remove" aria-label="Remove {{ it.name }}" style="width:15px;height:15px;display:flex;align-items:center;justify-content:center;flex:none;color:var(--muted)" style-hover="color:var(--err)">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
      </sc-for>
    </div>

    <div style="display:{{ r.dList }};flex-direction:column;gap:4px;margin-bottom:5px">
      <sc-for list="{{ r.items }}" as="li" hint-placeholder-count="4">
        <div onClick="{{ li.on }}" title="{{ li.title }}" style="display:flex;align-items:center;gap:7px;padding:5px 6px;border:1px solid var(--bord);border-radius:5px;background:{{ li.bg }}" style-hover="border-color:var(--accent)">
          <span style="display:{{ li.dGlyph }};width:13px;flex:none;text-align:center;font-size:11px;color:{{ li.color }}">{{ li.glyph }}</span>
          <span style="display:{{ li.dDot }};width:12px;height:12px;border-radius:3px;flex:none;border:1px solid rgba(255,255,255,.18);background:{{ li.color }}"></span>
          <div style="flex:1;min-width:0">
            <div style="font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ li.title2 }}</div>
            <div style="display:{{ li.dMeta }};font-size:9.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ li.meta }}</div>
          </div>
          <span style="font-size:10px;color:var(--muted);flex:none;font-variant-numeric:tabular-nums">{{ li.right }}</span>
          <button onClick="{{ li.onAction }}" title="{{ li.actionTitle }}" style="display:{{ li.dAction }};height:19px;padding:0 6px;border:1px solid var(--bord);border-radius:4px;font-size:10px;color:var(--muted);flex:none;align-items:center" style-hover="color:var(--accent);border-color:var(--accent)">{{ li.action }}</button>
          <button onClick="{{ li.onAction2 }}" title="{{ li.action2Title }}" style="display:{{ li.dAction2 }};height:19px;padding:0 6px;border:1px solid var(--bord);border-radius:4px;font-size:10px;color:var(--muted);flex:none;align-items:center" style-hover="color:var(--accent);border-color:var(--accent)">{{ li.action2 }}</button>
        </div>
      </sc-for>
    </div>

    <div style="display:{{ r.dTiles }};grid-template-columns:repeat({{ r.per }},1fr);gap:5px;margin-bottom:5px">
      <sc-for list="{{ r.items }}" as="tl" hint-placeholder-count="6">
        <div onClick="{{ tl.on }}" title="{{ tl.title }}" style="border:1px solid var(--bord);border-radius:5px;overflow:hidden;background:var(--panel2);cursor:grab" style-hover="border-color:var(--accent)">
          <div style="height:40px;display:flex;align-items:center;justify-content:center;background:{{ tl.bg }};font-size:15px;color:{{ tl.fg }}">
            <span style="display:{{ tl.dText }}">{{ tl.text }}</span>
            <svg style="display:{{ tl.dIcon }}" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="{{ tl.d }}"/></svg>
          </div>
          <div style="padding:3px 5px;font-size:9.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ tl.name }}</div>
        </div>
      </sc-for>
    </div>

    <div style="display:{{ r.dChecks }};flex-direction:column;gap:2px;margin-bottom:5px">
      <sc-for list="{{ r.items }}" as="ck" hint-placeholder-count="5">
        <button onClick="{{ ck.on }}" role="switch" aria-checked="{{ ck.a }}" style="display:flex;align-items:center;gap:7px;height:21px;padding:0 4px;border-radius:4px;font-size:11px;text-align:left" style-hover="background:var(--panel2)">
          <span style="width:13px;height:13px;border-radius:3px;border:1px solid {{ ck.bord }};background:{{ ck.box }};display:flex;align-items:center;justify-content:center;flex:none">
            <svg style="display:{{ ck.dTick }}" width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="m4.5 12.5 5 5 10-11"/></svg>
          </span>
          <span style="flex:1;min-width:0;color:{{ ck.fg }}">{{ ck.l }}</span>
          <span style="font-size:9.5px;color:var(--muted)">{{ ck.hint }}</span>
        </button>
      </sc-for>
    </div>

    <div style="display:{{ r.dBtns }};gap:5px;flex-wrap:wrap;margin-bottom:5px">
      <sc-for list="{{ r.items }}" as="b" hint-placeholder-count="2">
        <button onClick="{{ b.on }}" title="{{ b.title }}" style="flex:{{ b.flex }};height:24px;padding:0 9px;border:1px solid {{ b.bord }};border-radius:5px;font-size:11px;font-weight:500;background:{{ b.bg }};color:{{ b.fg }};white-space:nowrap" style-hover="border-color:var(--accent)">{{ b.l }}</button>
      </sc-for>
    </div>

    <div style="display:{{ r.dNote }};gap:6px;margin:2px 0 6px;padding:6px 7px;border-radius:5px;background:var(--panel2);border:1px solid var(--bord)">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="{{ r.noteColor }}" stroke-width="1.8" stroke-linecap="round" style="flex:none;margin-top:1px"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
      <span style="font-size:10px;color:var(--muted);line-height:1.45;text-wrap:pretty">{{ r.t }}</span>
    </div>

  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:280,&quot;height&quot;:420},&quot;rows&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;PanelRow[]&quot;},&quot;dense&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
/* CreativePanel — Creative Core panel body renderer.
   Shared by Trace, and by Forge/Folio later: a panel is DATA (rows), not
   bespoke markup, so every mode gets identical panel semantics, density and
   interaction for free. Row kinds: sec fields kv slider seg icons sw color
   grad tree stack list tiles checks btns note */
const KINDS = ['Sec','Fields','Kv','Slider','Seg','Icons','Sw','Color','Grad','Tree','Stack','List','Tiles','Checks','Btns','Note'];

class Component extends DCLogic {
  renderVals() {
    const dense = this.props.dense !== false;
    const h = dense ? '23px' : '26px';
    const rows = (this.props.rows || []).map((r) => {
      const o = { ...r, h, cols: r.cols || 'repeat(2,minmax(0,1fr))', per: r.per || 6,
        min: r.min ?? 0, max: r.max ?? 100, step: r.step ?? 1,
        vLabel: r.vLabel ?? r.v, meta: r.meta || '', noteColor: r.noteColor || 'var(--muted)' };
      KINDS.forEach((k) => { o['d' + k] = r.k === k.toLowerCase() ? (k === 'Fields' || k === 'Sw' || k === 'Tiles' ? 'grid' : 'flex') : 'none'; });
      o.items = (r.items || []).map((it) => ({
        ...it,
        bg: it.bg || (it.a ? 'var(--panel)' : 'transparent'),
        fg: it.fg || (it.a ? 'var(--ink)' : 'var(--muted)'),
        shadow: it.a ? '0 1px 2px rgba(0,0,0,.28)' : 'none',
        bord: it.bord || (it.a ? 'var(--accent)' : 'var(--bord)'),
        box: it.a ? 'var(--accent)' : 'transparent',
        dTick: it.a ? 'block' : 'none',
        flex: it.flex || 'none',
        pad: it.pad || '6px',
        title2: it.title2 ?? it.l ?? '',
        dGlyph: it.glyph ? 'block' : 'none',
        dDot: it.dot ? 'block' : 'none',
        dMeta: it.meta ? 'block' : 'none',
        dAction: it.action ? 'flex' : 'none',
        dAction2: it.action2 ? 'flex' : 'none',
        dSw: it.sw ? 'block' : 'none',
        dSpot: it.spot ? 'block' : 'none',
        dGlobal: it.global ? 'block' : 'none',
        dText: it.text ? 'block' : 'none',
        dIcon: it.d ? 'block' : 'none',
        dRemote: it.remote ? 'flex' : 'none',
        visD: it.hidden
          ? 'M10.6 5.2c.5-.1.9-.2 1.4-.2 6.5 0 10 7 10 7a15 15 0 0 1-1.8 2.7M6.5 6.5C3.8 8.3 2 12 2 12s3.5 7 10 7c1.4 0 2.7-.3 3.9-.8M9.9 9.9a3 3 0 0 0 4.2 4.2M3 3l18 18'
          : 'M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0',
        visColor: it.hidden ? 'var(--ink)' : 'rgba(151,151,159,.4)',
        shackle: it.locked ? 'M8 11V7a4 4 0 0 1 8 0v4' : 'M8 11V7a4 4 0 0 1 7.7-1.5',
        lockColor: it.locked ? 'var(--ink)' : 'rgba(151,151,159,.3)',
        caret: it.leaf ? '' : 'M8 5l8 7-8 7',
        iconColor: it.sel ? 'var(--accent)' : 'var(--muted)',
        mark: it.sel ? 'var(--accent)' : 'transparent',
        fgName: it.hidden ? 'var(--muted)' : 'var(--ink)'
      }));
      if (r.k === 'tree') o.items = o.items.map((it) => ({ ...it, fg: it.fgName }));
      return o;
    });
    return { rows };
  }
}
</script>
</body>
</html>
